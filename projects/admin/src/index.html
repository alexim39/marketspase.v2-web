<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>MarketSpase Admin</title>
  <meta name="description" content="MarketSpase platform administration.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0c1d">
  <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #0e0c1d;
      color: #f4f3ff;
      font-family: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .app-loading {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2em;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(102, 126, 234, 0.24), transparent 42%),
        linear-gradient(180deg, #151226 0%, #0e0c1d 72%);
    }
    .splash-inner { width: min(92vw, 420px); }
    .splash-logo { width: 180px; max-width: 68vw; height: auto; margin: 0 auto 1.5em; display: block; }
    .splash-eyebrow {
      margin: 0 0 0.6em;
      color: #aab8ff;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .splash-title { margin: 0; font-size: 1.4rem; letter-spacing: -0.03em; }
    .splash-status { margin: 1em 0 0; color: rgba(244, 243, 255, 0.55); font-size: 0.8rem; }
    @media (prefers-reduced-motion: no-preference) {
      .splash-inner { animation: splashIn 420ms ease both; }
    }
    @keyframes splashIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <script>
    // Apply the stored (or OS) MarketSpase theme before Angular boots (no flash).
    try {
      const stored = localStorage.getItem('selectedTheme');
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* private mode: stay dark */ }
  </script>
</head>
<body>
  <async-root>
    <div class="app-loading" role="status" aria-live="polite" aria-label="MarketSpase Admin is loading">
      <div class="splash-inner">
        <img class="splash-logo" src="/logo/marketspase-logo-white.png" alt="MarketSpase" width="1200" height="337">
        <p class="splash-eyebrow">Admin console</p>
        <p class="splash-title">Operating the MarketSpase business.</p>
        <p class="splash-status">Securing your session…</p>
      </div>
    </div>
  </async-root>
  <noscript>
    <div style="max-width:640px;margin:3rem auto;padding:1.5rem;color:#f4f3ff;">
      <h1>MarketSpase Admin</h1>
      <p>Administration requires JavaScript.</p>
    </div>
  </noscript>
</body>
</html>
