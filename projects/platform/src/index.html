  <style type="text/css">
    body, html {height: 100%; margin: 0;}
    body { background: #0f0d1c; }
    .app-loading { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; height: 100%; background: radial-gradient(600px 400px at 50% 38%, rgba(102,126,234,0.24), rgba(15,13,28,0) 70%), #0f0d1c; font-family: 'Manrope Variable', 'Manrope', 'Segoe UI', sans-serif; }
    .app-loading .brand-mark { width: 96px; height: 96px; border-radius: 50%; object-fit: contain; padding: 12px; background: rgba(255,255,255,0.04); border: 2px solid #667eea; box-shadow: 0 0 32px rgba(102,126,234,0.45); }
    .app-loading .spinner { height: 64px; width: 64px; animation: rotate 1.6s linear infinite; transform-origin: center center; }
    .app-loading .spinner .path { stroke-dasharray: 1, 200; stroke-dashoffset: 0; animation: dash 1.4s ease-in-out infinite; stroke-linecap: round; stroke: #8192ee; }
    @keyframes rotate {
      100% {   transform: rotate(360deg);  }
    }
    @keyframes dash {
      0% {   stroke-dasharray: 1, 200;   stroke-dashoffset: 0;  }
      50% {  stroke-dasharray: 89, 200;  stroke-dashoffset: -35px;  }
      100% { stroke-dasharray: 89, 200;  stroke-dashoffset: -124px;   }
    }
    .app-loading .loadbar { width: 180px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .app-loading .loadbar span { display: block; height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #667eea, #764ba2); animation: shimmer 1.4s ease-in-out infinite; }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
    .app-loading .logo { font-family: 'Bricolage Grotesque Variable', 'Bricolage Grotesque', 'Manrope Variable', sans-serif; color: #f5f3ff; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    .app-loading .sub { color: #b9b3c9; font-size: 12px; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) {
      .app-loading .spinner, .app-loading .spinner .path, .app-loading .loadbar span { animation: none; }
    }
  </style>

  <script>
    // Apply the stored (or OS) MarketSpase theme before Angular boots (no flash).
    try {
      const stored = localStorage.getItem('selectedTheme');
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* private mode: stay dark */ }
